name: Database migrations

# Migrations apply automatically when a change to them lands on main.
# Pull requests only get a dry run, so a broken migration is caught before
# it can touch the project.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  # Never let two migration runs race each other against one database.
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Verify against a throwaway database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration from empty, so a migration that only works
      # against the current production state fails here instead of there.
      - name: Start a local stack and apply all migrations
        run: supabase db start

      - name: Fail if the schema and migrations have drifted apart
        run: supabase db diff --check

  deploy:
    name: Apply to the project
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Show what is now applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
